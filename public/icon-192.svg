<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2DD4BF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#0D9488" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Фон с закруглёнными углами -->
  <rect width="192" height="192" rx="42" fill="#0F172A"/>
  <!-- Декоративное кольцо -->
  <circle cx="96" cy="96" r="72" stroke="url(#g1)" stroke-width="2.5" fill="url(#g2)" stroke-opacity="0.6"/>
  <!-- Буква П -->
  <text x="96" y="130" font-family="Georgia, 'Times New Roman', serif" font-size="90" font-weight="600" fill="url(#g1)" text-anchor="middle">П</text>
</svg>
